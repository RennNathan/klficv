<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letter</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap');
:root{--bg:#0e0a1f;--bg2:#1b1030;--text:#ffffff;--muted:#c9c0e8;--primary:#8a7dff;--primary-hover:#7a6af0;--primary-text:#ffffff;--secondary-bg:#1a1330;--font-pixel:'Silkscreen','VT323',monospace}
*{box-sizing:border-box;margin:0;padding:0;image-rendering:pixelated}
html{-webkit-tap-highlight-color:transparent;image-rendering:pixelated;scroll-snap-type:y mandatory;overflow-y:hidden}
body{min-height:100dvh;display:flex;flex-direction:column;background:linear-gradient(180deg,#1b1030 0%,#0e0a1f 55%,#070612 100%);background-color:var(--bg);font-family:var(--font-pixel);font-size:clamp(14px,4vw,16px);line-height:1.35;color:var(--text);position:relative;overflow-x:hidden;transition:opacity .2s steps(4),transform .2s steps(4);touch-action:manipulation;image-rendering:pixelated;letter-spacing:0.02em}
body.unlocked{overflow-y:auto}
@keyframes pageIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}body{animation:pageIn 0.45s ease}body.page-exit{opacity:0;transform:translateY(14px);transition:opacity 0.45s ease,transform 0.45s ease}
.clouds-layer{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bg-glow{position:fixed;top:50%;left:50%;width:500px;height:500px;background:radial-gradient(circle,rgba(138,125,255,0.3) 0%,rgba(138,125,255,0.09) 30%,rgba(100,80,220,0.045) 60%,transparent 80%);pointer-events:none;z-index:0;filter:blur(70px);transform:translate(-50%,-50%);animation:glowBreath 6s ease-in-out infinite}
.bg-glow2{position:fixed;top:30%;left:70%;width:350px;height:350px;background:radial-gradient(circle,rgba(169,198,255,0.22) 0%,rgba(169,198,255,0.075) 30%,transparent 60%);pointer-events:none;z-index:0;filter:blur(55px);transform:translate(-50%,-50%);animation:glowWobble 9s ease-in-out infinite}
.bg-glow3{position:fixed;top:75%;left:15%;width:280px;height:280px;background:radial-gradient(circle,rgba(169,130,255,0.22) 0%,rgba(169,130,255,0.06) 30%,transparent 60%);pointer-events:none;z-index:0;filter:blur(50px);transform:translate(-50%,-50%);animation:glowDrift 11s ease-in-out infinite}
.star-glow{position:fixed;pointer-events:none;z-index:0;font-size:18px;image-rendering:pixelated;color:#fff;text-shadow:0 0 8px rgba(255,255,255,0.7),0 0 16px rgba(169,198,255,0.35)}
@keyframes starTwinkle{0%,100%{opacity:0;transform:scale(0.5)}10%{opacity:1;transform:scale(1.2)}20%{opacity:0;transform:scale(0.8)}30%{opacity:0.6;transform:scale(1)}40%{opacity:0}}
@keyframes glowBreath{0%,100%{transform:translate(-50%,-50%) scale(1)}33%{transform:translate(-50%,-50%) scale(1.08)}66%{transform:translate(-50%,-50%) scale(0.95)}}
@keyframes glowWobble{0%,100%{transform:translate(-50%,-50%) translate(0,0)}25%{transform:translate(-50%,-50%) translate(40px,-35px)}50%{transform:translate(-50%,-50%) translate(-30px,40px)}75%{transform:translate(-50%,-50%) translate(20px,30px)}}
@keyframes glowDrift{0%,100%{transform:translate(-50%,-50%) translate(0,0)}20%{transform:translate(-50%,-50%) translate(-35px,-25px)}40%{transform:translate(-50%,-50%) translate(30px,35px)}60%{transform:translate(-50%,-50%) translate(25px,-30px)}80%{transform:translate(-50%,-50%) translate(-20px,20px)}}
@keyframes bubbleFloat{0%,100%{transform:translate(-50%,-50%) translate(0,0)}25%{transform:translate(-50%,-50%) translate(30px,-25px)}50%{transform:translate(-50%,-50%) translate(-20px,30px)}75%{transform:translate(-50%,-50%) translate(25px,20px)}}
.bg-glow.cursor-track{animation:none}
.bg-vignette{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,0.5) 100%)}
.bg-dots{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:0.04;background-image:radial-gradient(circle,rgba(255,255,255,0.5) 1px,transparent 1px);background-size:20px 20px}
.cloud{position:absolute;background:#FFFFFF;image-rendering:pixelated;box-shadow:0 4px 0 #ddd0ff;animation:cloudDrift 8s ease-in-out infinite alternate;transform:none;will-change:transform;transition:transform 0.6s ease-in}
.c1{left:6%;top:22%;width:12px;height:12px;box-shadow:12px 0 #FFFFFF,24px 0 #FFFFFF,36px 0 #FFFFFF,48px 0 #FFFFFF,60px 0 #FFFFFF,0 12px #FFFFFF,12px 12px #FFFFFF,24px 12px #FFFFFF,36px 12px #FFFFFF,48px 12px #FFFFFF,60px 12px #FFFFFF,12px 24px #ddd0ff,24px 24px #ddd0ff,36px 24px #ddd0ff,48px 24px #ddd0ff,12px -12px #FFFFFF,24px -12px #FFFFFF,36px -12px #FFFFFF}
.c2{left:28%;top:14%;width:12px;height:8px;box-shadow:12px 0 #FFFFFF,24px 0 #FFFFFF,0 8px #FFFFFF,12px 8px #FFFFFF,24px 8px #FFFFFF,12px 16px #ddd0ff,24px 16px #ddd0ff,12px -8px #FFFFFF}
.c3{left:52%;top:28%;width:12px;height:12px;box-shadow:12px 0 #FFFFFF,24px 0 #FFFFFF,36px 0 #FFFFFF,0 12px #FFFFFF,12px 12px #FFFFFF,24px 12px #FFFFFF,36px 12px #FFFFFF,12px 24px #ddd0ff,24px 24px #ddd0ff,36px 24px #ddd0ff,12px -12px #FFFFFF,24px -12px #FFFFFF}
.c4{left:78%;top:18%;width:10px;height:10px;box-shadow:10px 0 #FFFFFF,20px 0 #FFFFFF,30px 0 #FFFFFF,0 10px #FFFFFF,10px 10px #FFFFFF,20px 10px #FFFFFF,30px 10px #FFFFFF,10px 20px #ddd0ff,20px 20px #ddd0ff,10px -10px #FFFFFF,20px -10px #FFFFFF}
.c5{left:82%;top:42%;width:14px;height:10px;box-shadow:14px 0 #FFFFFF,0 10px #FFFFFF,14px 10px #FFFFFF,14px 20px #ddd0ff,7px -10px #FFFFFF}
.c6{left:66%;top:48%;width:8px;height:8px;box-shadow:8px 0 #FFFFFF,16px 0 #FFFFFF,24px 0 #FFFFFF,0 8px #FFFFFF,8px 8px #FFFFFF,16px 8px #FFFFFF,24px 8px #FFFFFF,8px 16px #ddd0ff,16px 16px #ddd0ff,8px -8px #FFFFFF,16px -8px #FFFFFF}
.c7{left:8%;top:62%;width:16px;height:14px;box-shadow:16px 0 #FFFFFF,32px 0 #FFFFFF,48px 0 #FFFFFF,0 14px #FFFFFF,16px 14px #FFFFFF,32px 14px #FFFFFF,48px 14px #FFFFFF,16px 28px #ddd0ff,32px 28px #ddd0ff,16px -14px #FFFFFF,32px -14px #FFFFFF}
@keyframes cloudDrift{0%{transform:translateX(0)}100%{transform:translateX(8px)}}
.hearts-layer{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.hearts-layer span{position:absolute;bottom:-20px;user-select:none;animation:floatUp linear infinite;will-change:transform,opacity}
@keyframes floatUp{0%{transform:translateY(110vh) rotate(var(--rot-start)) scale(0.9);opacity:0}12%{opacity:0.55}55%{opacity:0.5}88%{opacity:0.5}100%{transform:translateY(-15vh) rotate(var(--rot-end)) scale(1.05);opacity:0}}
#scrollRoot{flex:1;overflow-y:hidden;scroll-snap-type:y mandatory;position:relative;z-index:2}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.section{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;scroll-snap-align:start;position:relative;text-align:center;animation:fadeInUp 0.5s ease both}
.section.hidden{display:none}
.gif{image-rendering:auto !important;transform:none !important;will-change:auto !important;contain:none !important;filter:none !important;mix-blend-mode:normal !important}
.gif-wrap{width:100%;max-width:280px;overflow:hidden;background:var(--bg2);border:3px solid #1b1030;box-shadow:2px 2px 0 #1b1030;line-height:0;margin-bottom:18px}
.gif-wrap img{width:100%;height:auto;display:block;aspect-ratio:1.4/1;object-fit:cover;image-rendering:auto}
h1{font-size:clamp(18px,5.5vw,24px);font-weight:400;line-height:1.4;letter-spacing:0.01em;color:#ffffff;font-family:var(--font-pixel);image-rendering:pixelated;text-wrap:balance;text-align:center;max-width:320px;text-shadow:0 1px 6px rgba(14,10,31,0.5)}
.subtitle{font-size:clamp(11px,3.2vw,13px);color:#c9c0e8;opacity:0.85;letter-spacing:0.01em;line-height:1.4;font-family:var(--font-pixel);text-align:center;margin-top:8px;max-width:320px}
.hehe{font-size:clamp(14px,4vw,18px);color:#a9c6ff;font-family:var(--font-pixel);letter-spacing:0.05em;opacity:0.8;margin-top:4px}
.actions{display:flex;gap:12px;justify-content:center;align-items:center;width:100%;padding-top:16px}
.btn{width:auto;border-radius:0;font-size:12px;font-family:'Silkscreen',var(--font-pixel);font-weight:400;cursor:pointer;border:3px solid #1b1030;display:inline-flex;align-items:center;justify-content:center;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .08s steps(2),box-shadow .08s steps(2);flex-shrink:0;box-shadow: 3px 3px 0 #1b1030,inset 0 1px 0 rgba(255,255,255,0.4);line-height:1.2;text-align:center;image-rendering:pixelated;letter-spacing:0.01em;padding:10px 18px}
#yesBtn{background:var(--primary);color:var(--primary-text);box-shadow: 3px 3px 0 #1b1030,inset 0 1px 0 rgba(255,255,255,0.4)}
#yesBtn:hover{background:var(--primary-hover);transform:translate(-1px,-1px);box-shadow:4px 4px 0 #1b1030,inset 0 1px 0 rgba(255,255,255,0.4)}
#yesBtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #1b1030,inset 0 1px 0 rgba(255,255,255,0.4)}
#noBtn{background:var(--secondary-bg);color:#ffffff;border-color:#1b1030;box-shadow: 3px 3px 0 #1b1030,inset 0 1px 0 rgba(255,255,255,0.4)}
#noBtn:hover{border-color:#1b1030;transform:translate(-1px,-1px);box-shadow:4px 4px 0 #1b1030,inset 0 1px 0 rgba(255,255,255,0.4)}
#noBtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #1b1030,inset 0 1px 0 rgba(255,255,255,0.4)}
@keyframes wobble{0%{transform:rotate(0)}25%{transform:rotate(-1deg)}50%{transform:rotate(1deg)}75%{transform:rotate(-1deg)}100%{transform:rotate(0)}}
.wobble{animation:wobble .35s steps(4)}
@keyframes yipeeBlink{0%,92%{opacity:1}96%{opacity:0.4}100%{opacity:1}}
.yipee{font-family:'Silkscreen',var(--font-pixel);font-size:clamp(24px,8.5vw,36px);line-height:1.1;display:block;opacity:1 !important;position:relative;z-index:3;color:#ffffff !important;-webkit-text-fill-color:#ffffff;text-shadow:2px 2px 0 #1b1030,0 0 16px rgba(169,198,255,0.8);animation:yipeeBlink 3.5s ease infinite}
@media (max-width:500px){.yipee{font-size:28px;text-shadow:3px 3px 0 #1b1030,0 0 12px rgba(169,198,255,0.6)}}
.extra-yes{position:fixed;z-index:45;background:var(--primary);color:var(--primary-text);border:3px solid #1b1030;box-shadow:2px 2px 0 #1b1030;transform:translate(-50%, -50%);animation:popIn .2s steps(4) forwards;font-family:var(--font-pixel);font-size:8px;border-radius:0;image-rendering:pixelated}
.extra-yes:hover{background:var(--primary-hover);transform:translate(calc(-50% + 1px),calc(-50% + 1px));box-shadow:1px 1px 0 #1b1030}
.extra-yes:active{transform:translate(calc(-50% + 2px),calc(-50% + 2px));box-shadow:none}
@keyframes popIn{0%{transform:translate(-50%,-50%) scale(.85);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(10px);background:#1b1030;color:#fff;padding:8px 12px;border:3px solid #1b1030;box-shadow:2px 2px 0 rgba(0,0,0,0.4);font-family:var(--font-pixel);font-size:8px;opacity:0;pointer-events:none;transition:opacity .15s steps(4),transform .15s steps(4);white-space:nowrap;z-index:40;image-rendering:pixelated}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#confettiCanvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99;display:none;image-rendering:pixelated}
#confettiCanvas.active{display:block}
.btn-primary{background:var(--primary);color:var(--primary-text)}.btn-primary:hover{background:var(--primary-hover);transform:translate(-1px,-1px);box-shadow:4px 4px 0 #1b1030,inset 0 1px 0 rgba(255,255,255,0.4)}.btn-primary:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #1b1030,inset 0 1px 0 rgba(255,255,255,0.4)}.btn-secondary{background:var(--secondary-bg);color:#d8d4f0;max-width:200px}.btn-secondary:hover{background:#251a4a;transform:translate(-1px,-1px);box-shadow:4px 4px 0 #1b1030,inset 0 1px 0 rgba(255,255,255,0.4)}.btn-secondary:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #1b1030,inset 0 1px 0 rgba(255,255,255,0.4)}.btn:focus-visible{outline:2px solid #a9c6ff;outline-offset:2px}
.music-hint{position:fixed;bottom:56px;right:14px;background:#1b1030;color:#fff;border:2px solid #a9c6ff;border-radius:999px;padding:6px 12px;font-family:Silkscreen;font-size:11px;z-index:50;animation:hintPulse 1.2s infinite alternate;box-shadow:2px 2px 0 #1b1030;cursor:pointer}
@keyframes hintPulse{from{transform:scale(1)}to{transform:scale(1.06)}}
.music-hint.hidden{opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity 0.35s,transform 0.35s}
.place-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(300px,85vw);margin:10px 0}
.place-btn{font-family:var(--font-pixel);font-size:11px;padding:10px;border:3px solid #1b1030;background:var(--secondary-bg);color:#fff;cursor:pointer;box-shadow:3px 3px 0 #1b1030;transition:transform .08s steps(2),box-shadow .08s steps(2),background .15s;image-rendering:pixelated;text-align:center}
.place-btn:hover{background:var(--primary-hover);transform:translate(-1px,-1px);box-shadow:4px 4px 0 #1b1030}
.place-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #1b1030}
.place-btn.selected{background:var(--primary);color:var(--primary-text);box-shadow:3px 3px 0 #1b1030}
.text-input{width:min(300px,85vw);margin:10px 0}
.text-input input{width:100%;padding:10px;border:3px solid #1a1330;background:#fff;color:#1b1030;font-family:var(--font-pixel);font-size:11px;outline:none;box-shadow:3px 3px 0 #2a2050}
.text-input input:focus{border:2px dashed #8a7dff;box-shadow:3px 3px 0 #2a2050}
@media (max-width:430px){.section{padding-top:8vh}}
.date-field{width:100%;display:flex;flex-direction:column;gap:8px;align-items:center}
#dateInput{width:min(280px,90vw);margin:16px 0 14px;height:44px;border:3px solid #1a1330;background:#fff;color:#1b1030;font-family:'Silkscreen',monospace;font-size:10px;text-align:center;outline:none;-webkit-appearance:none;appearance:none;padding:8px 10px}
#dateInput:focus{border:2px dashed #8a7dff;box-shadow:3px 3px 0 #2a2050}
.selected-display{font-family:'Silkscreen',monospace;font-size:12px;line-height:1.5;color:#1b1030;background:#e8e9ff;border:3px solid #1a1330;box-shadow:3px 3px 0 #2a2050;padding:7px 10px;width:100%;max-width:min(280px,90vw);word-break:break-word}
.overlay{position:fixed;inset:0;background:rgba(14,10,31,0.78);display:flex;align-items:center;justify-content:center;padding:20px 12px;opacity:0;pointer-events:none;transition:opacity .2s steps(4);z-index:100}
.overlay.open{opacity:1;pointer-events:auto}
.overlay-card{background:#fff;border:4px solid #1a1330;box-shadow:8px 8px 0 #2a2050,12px 12px 0 rgba(0,0,0,0.2);padding:24px 18px;max-width:400px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;transform:translateY(6px);transition:transform .2s steps(4);color:#1b1030}
.overlay.open .overlay-card{transform:translateY(0)}
#overlayMaybe{z-index:110}
.overlay-card h2{font-family:'Silkscreen',monospace;font-size:14px;line-height:1.4}
.overlay-card p{font-family:'Silkscreen',monospace;font-size:10px;color:var(--muted);line-height:1.6}
</style>
</head>
<body>
<audio id="bgMusic" src="assets/silly-cat.mp3" loop preload="auto" style="display:none"></audio>
<button id="soundBtn" style="position:fixed;bottom:12px;left:12px;z-index:99;font-family:var(--font-pixel);font-size:10px;padding:6px 10px;border:2px solid #1b1030;box-shadow:2px 2px 0 #1b1030;background:#fff">🔊 Sound ON</button>
<div id="musicHint" class="music-hint">tap 🔊 to turn on music</div>
<div class="bg-glow"></div>
<div class="bg-glow2"></div>
<div class="bg-glow3"></div>
<div class="bg-vignette"></div>
<div class="bg-dots"></div>
<div class="clouds-layer" aria-hidden="true"><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><div class="cloud c4"></div><div class="cloud c5"></div><div class="cloud c6"></div><div class="cloud c7"></div></div>
<div class="hearts-layer" aria-hidden="true" id="heartsLayer"></div>

<div id="scrollRoot">
  <section class="section" id="sec1">
    <img src="assets/nervous.gif" alt="nervous" id="mainGif" class="gif" style="max-width:280px;width:min(280px,80vw);display:block;margin:0 auto 18px;border:3px solid #1b1030;box-shadow:2px 2px 0 #1b1030">
    <h1>Can I court u?</h1>
    <img src="assets/plead.gif" id="pleadGif" class="gif" style="width:80px;display:block;margin:14px auto 6px;mix-blend-mode:lighten;pointer-events:none">
    <div class="actions">
      <button id="yesBtn" class="btn" type="button" aria-label="Yes">Yada</button>
      <button id="noBtn" class="btn" type="button" aria-label="Nada">Nada</button>
    </div>
    <div id="belowRow" style="display:flex;gap:12px;justify-content:center;align-items:flex-start;width:min(320px,90vw);margin:14px auto 0"><div style="flex:1;display:flex;justify-content:center"><img src="assets/beg-crying.gif" id="begGif" class="gif" style="width:120px;max-width:100%;border:3px solid #1b1030;box-shadow:2px 2px 0 #1b1030"></div><div style="flex:1;display:flex;flex-direction:column;align-items:center"><img id="photoSwitch" src="assets/p1.webp" style="width:120px;height:120px;object-fit:cover;border:3px solid #1b1030;display:block"></div></div>
  </section>

  <section class="section hidden" id="sec2">
    <img src="assets/potz.gif" alt="potz" class="gif" width="200" height="200" loading="eager" decoding="async" style="width:200px;height:200px;display:block;margin:0 auto 12px;image-rendering:auto;pointer-events:none">
    <h1 class="yipee">TOTOO BA TO??</h1>
    <p class="hehe">hehe</p>
    <button id="planDateBtn" class="btn" type="button">Plan the date</button>
  </section>

  <section class="section hidden" id="sec3">
    <img src="assets/cat-jump.gif" id="mainGif" class="gif" loading="eager" decoding="async" style="max-width:280px;width:min(280px,80vw);display:block;margin:0 auto 18px;border:3px solid #1b1030;box-shadow:2px 2px 0 #1b1030;image-rendering:auto" alt="nervous">
    <h1>Pick a day, libre ko pramis</h1>
    <div class="date-field">
      <input type="date" id="dateInput" value="2026-08-31" aria-label="Pick a date">
      <div class="selected-display" id="selectedDisplay">Selected: 08/31/2026 — Monday</div>
    </div>
    <img id="pleadGif" src="assets/huu.gif" class="gif" loading="eager" decoding="async" style="width:80px;display:block;margin:0 auto;pointer-events:none;image-rendering:auto" alt="plead">
    <div class="actions">
      <button id="continueBtn" class="btn" type="button" aria-label="Continue">Continue</button>
    </div>
  </section>
  <section class="section hidden" id="sec4">
    <img src="assets/cat-jump.gif" class="gif" loading="eager" decoding="async" style="max-width:280px;width:min(280px,80vw);display:block;margin:0 auto 14px;border:3px solid #1b1030;box-shadow:2px 2px 0 #1b1030;image-rendering:auto" alt="cat jump">
    <h1>Where should we go?</h1>
    <div class="place-grid">
      <button class="place-btn" type="button" data-place="Ayala Mall">Ayala Mall</button>
      <button class="place-btn" type="button" data-place="Market Market">Market Market</button>
      <button class="place-btn" type="button" data-place="SM Aura">SM Aura</button>
      <button class="place-btn" type="button" data-place="MOA">MOA</button>

      <input type="text" id="placeInput" placeholder="or type your own place" aria-label="Type your own place">

    <div class="actions">
      <button id="sec4Continue" class="btn btn-primary" type="button">Continue</button>
    </div>

  <section class="section hidden" id="sec5">
    <img src="assets/cat-jump.gif" class="gif" loading="eager" decoding="async" style="max-width:280px;width:min(280px,80vw);display:block;margin:0 auto 14px;border:3px solid #1b1030;box-shadow:2px 2px 0 #1b1030;image-rendering:auto" alt="gift">
    <h1>What should I give u?</h1>
    <div class="place-grid">
      <button class="place-btn selected" type="button" data-gift="more squishy?">more squishy?</button>
      <button class="place-btn" type="button" data-gift="all the cuddles">all the cuddles</button>
      <button class="place-btn" type="button" data-gift="surprises">surprises</button>
    </div>
    <div class="text-input">
      <input type="text" id="giftInput" placeholder="or type your own gift idea" aria-label="Type your own gift idea">
    </div>
    <div class="actions">
      <button id="sec5Submit" class="btn btn-primary" type="button">Submit</button>
      <button id="maybeLaterBtn" class="btn" type="button" style="font-size:10px">Ion know</button>
    </div>
  </section>
