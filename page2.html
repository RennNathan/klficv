<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>yipee</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0a1f;--bg2:#1b1030;--primary:#8a7dff;--primary-hover:#7a6af0}
*{box-sizing:border-box;margin:0;padding:0;image-rendering:pixelated}
html{-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#1b1030 0%,#0e0a1f 55%,#070612 100%);background-color:#0e0a1f;font-family:'Silkscreen',monospace;color:#fff;position:relative;overflow-x:hidden}
.gif{image-rendering:auto !important;transform:none !important;will-change:auto !important;contain:none !important;filter:none !important;mix-blend-mode:normal !important}
.clouds-layer{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
@keyframes cloudInLeft{from{transform:translateX(-120vw);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes cloudInRight{from{transform:translateX(120vw);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes cloudOutLeft{from{transform:translateX(0);opacity:1}to{transform:translateX(-120vw);opacity:0}}
@keyframes cloudOutRight{from{transform:translateX(0);opacity:1}to{transform:translateX(120vw);opacity:0}}
.cloud{position:absolute;background:#fff;will-change:transform;transform:translateX(-120vw);opacity:0;transform:translateZ(0) translateX(-120vw)}
.cloud:nth-child(odd){animation:cloudInLeft 0.65s 0.1s ease-out forwards}
.cloud:nth-child(even){animation:cloudInRight 0.65s 0.1s ease-out forwards}
.c1,.c2,.c3,.c7{animation-name:cloudInLeft}
.c4,.c5,.c6{animation-name:cloudInRight;transform:translateX(120vw)}
.cloud.cloud-enter{transform:translateX(0);opacity:1}
.cloud.cloud-exit{animation:none !important;will-change:auto}
.cloud.exiting-left{animation:cloudOutLeft 0.6s ease-in forwards}
.cloud.exiting-right{animation:cloudOutRight 0.6s ease-in forwards}
.content-exit{opacity:0;transform:translateY(12px);transition:opacity 0.45s ease,transform 0.45s ease}
.wrap.content-exit{opacity:0;transform:translateY(12px);transition:opacity 0.45s ease,transform 0.45s ease}
.c1{left:6%;top:22%;width:12px;height:12px;box-shadow:12px 0 #fff,24px 0 #fff,36px 0 #fff,48px 0 #fff,60px 0 #fff,0 12px #fff,12px 12px #fff,24px 12px #fff,36px 12px #fff,48px 12px #fff,60px 12px #fff,12px 24px #ddd0ff,24px 24px #ddd0ff,36px 24px #ddd0ff,48px 24px #ddd0ff,12px -12px #fff,24px -12px #fff,36px -12px #fff}
.c2{left:28%;top:14%;width:12px;height:8px;box-shadow:12px 0 #fff,24px 0 #fff,0 8px #fff,12px 8px #fff,24px 8px #fff,12px 16px #ddd0ff,24px 16px #ddd0ff,12px -8px #fff}
.c3{left:52%;top:28%;width:12px;height:12px;box-shadow:12px 0 #fff,24px 0 #fff,36px 0 #fff,0 12px #fff,12px 12px #fff,24px 12px #fff,36px 12px #fff,12px 24px #ddd0ff,24px 24px #ddd0ff,36px 24px #ddd0ff,12px -12px #fff,24px -12px #fff}
.c4{left:78%;top:18%;width:10px;height:10px;box-shadow:10px 0 #fff,20px 0 #fff,30px 0 #fff,0 10px #fff,10px 10px #fff,20px 10px #fff,30px 10px #fff,10px 20px #ddd0ff,20px 20px #ddd0ff,10px -10px #fff,20px -10px #fff}
.c5{left:82%;top:42%;width:14px;height:10px;box-shadow:14px 0 #fff,0 10px #fff,14px 10px #fff,14px 20px #ddd0ff,7px -10px #fff}
.c6{left:66%;top:48%;width:8px;height:8px;box-shadow:8px 0 #fff,16px 0 #fff,24px 0 #fff,0 8px #fff,8px 8px #fff,16px 8px #fff,24px 8px #fff,8px 16px #ddd0ff,16px 16px #ddd0ff,8px -8px #fff,16px -8px #fff}
.c7{left:8%;top:62%;width:16px;height:14px;box-shadow:16px 0 #fff,32px 0 #fff,48px 0 #fff,0 14px #fff,16px 14px #fff,32px 14px #fff,48px 14px #fff,16px 28px #ddd0ff,32px 28px #ddd0ff,16px -14px #fff,32px -14px #fff}
.hearts-layer{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.hearts-layer span{position:absolute;bottom:-20px;animation:floatUp linear infinite;user-select:none;line-height:1}
@keyframes floatUp{0%{transform:translateY(0) rotate(var(--rot-start));opacity:0}12%{opacity:var(--heart-opa,0.6)}88%{opacity:var(--heart-opa,0.6)}100%{transform:translateY(-115vh) rotate(var(--rot-end));opacity:0}}
.wrap{width:100%;max-width:420px;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;position:relative;z-index:2;padding:24px 16px;text-align:center;animation:pageIn 0.45s ease-out both}
.wrap.page-in{animation:pageIn 0.45s ease-out both}
@keyframes pageIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes yipeeBlink{0%,88%{opacity:1}92%{opacity:0.35}96%{opacity:1}100%{opacity:1}}
h1.yipee{font-family:'Silkscreen',monospace;font-size:clamp(22px, 8vw, 34px);line-height:1.1;display:block;opacity:1 !important;position:relative;z-index:3;color:#ffffff !important;-webkit-text-fill-color:#ffffff;text-shadow:2px 2px 0 #1b1030,0 0 12px rgba(169,198,255,0.6);animation:yipeeBlink 2.2s ease infinite}
@media (max-width:500px){.yipee{font-size:28px;text-shadow:3px 3px 0 #1b1030,0 0 12px rgba(169,198,255,0.6)}}
body{background:linear-gradient(180deg,#1b1030 0%,#0e0a1f 55%,#070612 100%);background-color:#1b1030}
.btn{font-family:'Silkscreen',monospace;font-size:10px;cursor:pointer;border:3px solid #1b1030;background:var(--primary);color:#fff;box-shadow:3px 3px 0 #1b1030;padding:10px 18px;min-width:140px;height:44px;display:inline-flex;align-items:center;justify-content:center;user-select:none;touch-action:manipulation}
.btn:hover{background:var(--primary-hover)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #1b1030}
.btn:focus-visible{outline:2px dashed #8a7dff;outline-offset:2px}
.music-hint{position:fixed;bottom:56px;right:14px;background:#1b1030;color:#fff;border:2px solid #a9c6ff;border-radius:999px;padding:6px 12px;font-family:Silkscreen;font-size:11px;z-index:50;animation:hintPulse 1.2s infinite alternate;box-shadow:2px 2px 0 #1b1030;cursor:pointer} @keyframes hintPulse{from{transform:scale(1)}to{transform:scale(1.06)}} .music-hint.hidden{opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity 0.35s,transform 0.35s}</style>
</head>
<body>
<audio id="bgMusic" src="assets/silly-cat.mp3" loop preload="auto" style="display:none"></audio>
<div id="musicHint" class="music-hint">tap 🔊 to turn on music</div>
<button id="soundBtn" style="position:fixed;bottom:12px;left:12px;z-index:99;font-family:var(--font-pixel);font-size:10px;padding:6px 10px;border:2px solid #1b1030;box-shadow:2px 2px 0 #1b1030;background:#fff">🔊 Sound ON</button>
<div class="clouds-layer" aria-hidden="true"><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><div class="cloud c4"></div><div class="cloud c5"></div><div class="cloud c6"></div><div class="cloud c7"></div></div>
<div class="hearts-layer" aria-hidden="true" id="heartsLayer"></div>
<div class="wrap" id="wrap">
<img src="assets/potz.gif" alt="potz" class="gif" width="200" height="200" loading="eager" decoding="async" style="width:200px;height:200px;display:block;margin:0 auto 12px;image-rendering:auto;pointer-events:none">
<h1 class="yipee">yipee</h1>
<button id="continueBtn" class="btn" type="button">Plan the date</button>
</div>
<script>
(function(){
let ctx;function initBg(){const bg=document.getElementById('bgMusic');const btn=document.getElementById('soundBtn');if(!bg)return()=>{};bg.muted=false;bg.volume=0.6;bg.loop=true;bg.preload='auto';function updateBtn(){if(btn)btn.textContent=bg.paused?'🔊 Sound OFF':'🔊 Sound ON';}
const saved=sessionStorage.getItem('bgTime');if(saved)try{bg.currentTime=parseFloat(saved);}catch(e){}
let stored=sessionStorage.getItem('bgPlaying'); if(stored!=='1'){ sessionStorage.setItem('bgPlaying','1'); stored='1'; } try{localStorage.setItem('soundFixV3','1')}catch(e){}const wasPlaying=sessionStorage.getItem('bgPlaying')==='1';if(wasPlaying){bg.play().then(updateBtn).catch(()=>{});updateBtn();}else updateBtn();
function tryPlay(){bg.muted=false;if(ctx&&ctx.state==='suspended')ctx.resume().catch(()=>{});if(bg.paused) return bg.play().then(()=>{sessionStorage.setItem('bgPlaying','1');updateBtn();}).catch(e=>{console.log('[bgMusic] play blocked',e);});}
document.addEventListener('click',tryPlay,{once:true});document.addEventListener('touchstart',tryPlay,{once:true});
setInterval(()=>{if(!bg.paused)sessionStorage.setItem('bgTime',bg.currentTime)},500);
window.addEventListener('beforeunload',()=>{sessionStorage.setItem('bgTime',bg.currentTime);sessionStorage.setItem('bgPlaying',bg.paused?'0':'1');});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&sessionStorage.getItem('bgPlaying')==='1'&&bg.paused)bg.play().then(updateBtn).catch(()=>{});});
if(btn)btn.addEventListener('click',function(e){e.stopPropagation();if(bg.paused){bg.muted=false;bg.play().then(()=>{sessionStorage.setItem('bgPlaying','1');updateBtn();}).catch(err=>console.log('[bgMusic] toggle play fail',err));}else{bg.pause();sessionStorage.setItem('bgPlaying','0');updateBtn();}});
document.getElementById("musicHint")?.addEventListener("click",function(e){e.stopPropagation();if(bg.paused){bg.muted=false;bg.play().then(function(){sessionStorage.setItem("bgPlaying","1");updateBtn();document.getElementById("musicHint").classList.add("hidden");}).catch(function(){});}else{bg.pause();sessionStorage.setItem("bgPlaying","0");updateBtn();document.getElementById("musicHint").classList.remove("hidden");}});
return tryPlay;}const bgTryPlay=initBg();
var heartsLayer=document.getElementById('heartsLayer');
var colors=['#ffffff','#ffffff','#a9c6ff','#8a7dff'];
for(var i=0;i<16;i++){var el=document.createElement('span');el.textContent='\u2665';var size=(16+Math.random()*12).toFixed(1);var left=(Math.random()*100).toFixed(2);var dur=10+Math.random()*6;var delay=-(Math.random()*dur);var rs=(-18+Math.random()*36).toFixed(1);var re=(parseFloat(rs)+(Math.random()*20-10)).toFixed(1);var col=colors[Math.floor(Math.random()*colors.length)];var opa=(0.58+Math.random()*0.08).toFixed(2);el.style.left=left+'%';el.style.fontSize=size+'px';el.style.color=col;el.style.setProperty('--heart-opa',opa);el.style.setProperty('--rot-start',rs+'deg');el.style.setProperty('--rot-end',re+'deg');el.style.animationDuration=dur.toFixed(2)+'s';el.style.animationDelay=delay.toFixed(2)+'s';heartsLayer.appendChild(el);}
var clouds=document.querySelectorAll('.cloud');
clouds.forEach(function(c){var r=c.getBoundingClientRect();if(r.left < innerWidth/2) c.style.transform='translateX(-120vw)'; else c.style.transform='translateX(120vw)';});
requestAnimationFrame(function(){requestAnimationFrame(function(){
clouds.forEach(function(c){c.classList.add('cloud-enter');c.style.transform='translateX(0)';});
var wrap=document.getElementById('wrap');if(wrap)wrap.classList.add('page-in');
});});
var _navigating=false;
function goPage3(){if(_navigating)return;_navigating=true;try{bgTryPlay();}catch(e){}
clouds.forEach(function(c){var r=c.getBoundingClientRect();c.classList.remove('cloud-enter');c.classList.add('cloud-exit');if(r.left < innerWidth/2) c.classList.add('exiting-left'); else c.classList.add('exiting-right');});
var w=document.getElementById('wrap');if(w){w.classList.add('content-exit');w.style.transition='opacity 0.45s ease,transform 0.45s ease';w.style.opacity='0';w.style.transform='translateY(14px)';}
setTimeout(function(){spaGo('page3.html');},600);}
var cb=document.getElementById('continueBtn');
if(cb){cb.addEventListener('click',goPage3);cb.addEventListener('touchstart',function(e){e.preventDefault();goPage3();},false);}
})();
</script>

<script id="spa-nav">
function spaGo(url){
  const keepBg=document.getElementById('bgMusic');
  const keepBtn=document.getElementById('soundBtn');
  const keepHint=document.getElementById('musicHint');
  var _navTimeout=setTimeout(function(){location.href=url;},3000);
  fetch(url).then(r=>r.text()).then(html=>{
    clearTimeout(_navTimeout);
    const d=new DOMParser().parseFromString(html,'text/html');
    d.querySelectorAll('style,link[rel="stylesheet"]').forEach(function(n){
      var href=n.getAttribute('href');
      if(n.tagName==='LINK' && href && document.querySelector('link[href="'+href+'"]')) return;
      document.head.appendChild(n.cloneNode(true));
    });
    d.querySelectorAll('#bgMusic,#soundBtn,#musicHint').forEach(function(el){el.remove();});
    document.body.innerHTML=d.body.innerHTML;
    if(keepBg) document.body.appendChild(keepBg);
    if(keepBtn) document.body.appendChild(keepBtn);
    if(keepHint) document.body.appendChild(keepHint);
    history.pushState(null,'',url);
    requestAnimationFrame(function(){requestAnimationFrame(function(){
      document.querySelectorAll('.cloud').forEach(function(c){c.classList.add('cloud-enter');c.style.transform='translateX(0)';});
      var w=document.querySelector('.wrap'); if(w) w.classList.add('page-in');
    });});
  }).catch(function(){clearTimeout(_navTimeout);location.href=url;});
}
window.addEventListener('popstate',()=>{location.reload();});
</script>

</body>
</html>
