<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>yipee</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0a1f;--bg2:#1b1030;--primary:#8a7dff;--primary-hover:#7a6af0}
*{box-sizing:border-box;margin:0;padding:0;image-rendering:pixelated}
html{-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#1b1030 0%,#0e0a1f 55%,#070612 100%);background-color:#0e0a1f;font-family:'Silkscreen',monospace;color:#fff;position:relative;overflow-x:hidden}
.clouds-layer{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.cloud{position:absolute;background:#fff}
.cloud.cloud-enter{transition:transform 0.6s ease-out}
.c1{left:6%;top:22%;width:12px;height:12px;box-shadow:12px 0 #fff,24px 0 #fff,36px 0 #fff,48px 0 #fff,60px 0 #fff,0 12px #fff,12px 12px #fff,24px 12px #fff,36px 12px #fff,48px 12px #fff,60px 12px #fff,12px 24px #ddd0ff,24px 24px #ddd0ff,36px 24px #ddd0ff,48px 24px #ddd0ff,12px -12px #fff,24px -12px #fff,36px -12px #fff}
.c2{left:28%;top:14%;width:12px;height:8px;box-shadow:12px 0 #fff,24px 0 #fff,0 8px #fff,12px 8px #fff,24px 8px #fff,12px 16px #ddd0ff,24px 16px #ddd0ff,12px -8px #fff}
.c3{left:52%;top:28%;width:12px;height:12px;box-shadow:12px 0 #fff,24px 0 #fff,36px 0 #fff,0 12px #fff,12px 12px #fff,24px 12px #fff,36px 12px #fff,12px 24px #ddd0ff,24px 24px #ddd0ff,36px 24px #ddd0ff,12px -12px #fff,24px -12px #fff}
.c4{left:78%;top:18%;width:10px;height:10px;box-shadow:10px 0 #fff,20px 0 #fff,30px 0 #fff,0 10px #fff,10px 10px #fff,20px 10px #fff,30px 10px #fff,10px 20px #ddd0ff,20px 20px #ddd0ff,10px -10px #fff,20px -10px #fff}
.c5{left:82%;top:42%;width:14px;height:10px;box-shadow:14px 0 #fff,0 10px #fff,14px 10px #fff,14px 20px #ddd0ff,7px -10px #fff}
.c6{left:66%;top:48%;width:8px;height:8px;box-shadow:8px 0 #fff,16px 0 #fff,24px 0 #fff,0 8px #fff,8px 8px #fff,16px 8px #fff,24px 8px #fff,8px 16px #ddd0ff,16px 16px #ddd0ff,8px -8px #fff,16px -8px #fff}
.c7{left:8%;top:62%;width:16px;height:14px;box-shadow:16px 0 #fff,32px 0 #fff,48px 0 #fff,0 14px #fff,16px 14px #fff,32px 14px #fff,48px 14px #fff,16px 28px #ddd0ff,32px 28px #ddd0ff,16px -14px #fff,32px -14px #fff}
.hearts-layer{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden;contain:layout}
.hearts-layer span{position:absolute;bottom:-20px;animation:floatUp linear infinite;will-change:transform,opacity;user-select:none;line-height:1}
@keyframes floatUp{0%{transform:translateY(0) rotate(var(--rot-start));opacity:0}12%{opacity:var(--heart-opa,0.6)}88%{opacity:var(--heart-opa,0.6)}100%{transform:translateY(-115vh) rotate(var(--rot-end));opacity:0}}
.wrap{width:100%;max-width:420px;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;position:relative;z-index:2;padding:24px 16px;text-align:center;opacity:0;transform:translateY(14px)}
.wrap.page-in{animation:pageIn 0.45s ease forwards}
@keyframes pageIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes yipeeBlink{0%,45%{opacity:1}50%,85%{opacity:0.35}100%{opacity:1}}
h1.yipee{font-family:'Silkscreen',monospace;font-size:clamp(22px,7vw,32px);color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.4);animation:yipeeBlink 1.8s ease infinite}
.btn{font-family:'Silkscreen',monospace;font-size:10px;cursor:pointer;border:3px solid #1b1030;background:var(--primary);color:#fff;box-shadow:3px 3px 0 #1b1030;padding:10px 18px;min-width:140px;height:44px;display:inline-flex;align-items:center;justify-content:center;user-select:none;touch-action:manipulation}
.btn:hover{background:var(--primary-hover)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #1b1030}
.btn:focus-visible{outline:2px dashed #8a7dff;outline-offset:2px}
</style>
</head>
<body>
<div class="clouds-layer" aria-hidden="true"><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><div class="cloud c4"></div><div class="cloud c5"></div><div class="cloud c6"></div><div class="cloud c7"></div></div>
<div class="hearts-layer" aria-hidden="true" id="heartsLayer"></div>
<div class="wrap" id="wrap">
<img src="assets/potz.gif" alt="potz" style="width:120px;display:block;margin:0 auto 12px;image-rendering:auto;mix-blend-mode:lighten;pointer-events:none">
<h1 class="yipee">yipee</h1>
<button id="continueBtn" class="btn" type="button">Continue -></button>
</div>
<script>
(function(){
var heartsLayer=document.getElementById('heartsLayer');
var colors=['#ffffff','#ffffff','#a9c6ff','#8a7dff'];
for(var i=0;i<16;i++){var el=document.createElement('span');el.textContent='\u2665';var size=(16+Math.random()*12).toFixed(1);var left=(Math.random()*100).toFixed(2);var dur=10+Math.random()*6;var delay=-(Math.random()*dur);var rs=(-18+Math.random()*36).toFixed(1);var re=(parseFloat(rs)+(Math.random()*20-10)).toFixed(1);var col=colors[Math.floor(Math.random()*colors.length)];var opa=(0.58+Math.random()*0.08).toFixed(2);el.style.left=left+'%';el.style.fontSize=size+'px';el.style.color=col;el.style.setProperty('--heart-opa',opa);el.style.setProperty('--rot-start',rs+'deg');el.style.setProperty('--rot-end',re+'deg');el.style.animationDuration=dur.toFixed(2)+'s';el.style.animationDelay=delay.toFixed(2)+'s';heartsLayer.appendChild(el);}
var clouds=document.querySelectorAll('.cloud');
clouds.forEach(function(c){var r=c.getBoundingClientRect();if(r.left < innerWidth/2) c.style.transform='translateX(-120vw)'; else c.style.transform='translateX(120vw)';});
let yippeeAudio=new Audio('assets/yippee-tbh.mp3');yippeeAudio.volume=0.6;
try{yippeeAudio.play().catch(function(){});}catch(e){}
document.addEventListener('click',function(){yippeeAudio.currentTime=0;yippeeAudio.play().catch(function(){})},{once:true});
document.addEventListener('touchstart',function(){yippeeAudio.currentTime=0;yippeeAudio.play().catch(function(){})},{once:true});
requestAnimationFrame(function(){requestAnimationFrame(function(){
clouds.forEach(function(c){c.classList.add('cloud-enter');c.style.transform='translateX(0)';});
var wrap=document.getElementById('wrap');wrap.classList.add('page-in');
try{yippeeAudio.play().catch(function(){});}catch(e){}
});});
document.getElementById('continueBtn').addEventListener('click',function(){
clouds.forEach(function(c){var r=c.getBoundingClientRect();c.classList.remove('cloud-enter');c.style.transition='transform 0.6s ease-in';if(r.left < innerWidth/2) c.style.transform='translateX(-120vw)'; else c.style.transform='translateX(120vw)';});
var w=document.getElementById('wrap');w.style.transition='opacity 0.45s ease,transform 0.45s ease';w.style.opacity='0';w.style.transform='translateY(14px)';
setTimeout(function(){location.href='page3.html';},600);
});
})();
</script>
</body>
</html>
